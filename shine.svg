
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100">

  <defs>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .letter {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 400;
        text-anchor: middle;
        fill: #B7EACB;
        transform-box: fill-box;
        transform-origin: center;
        animation: goldPulse 2.4s linear infinite;
      }

      @keyframes goldPulse {
        0%, 100% {
          fill: #B7EACB;
          transform: scale(1);
          filter: none;
        }
        1.5% {
          fill: #FFF700;
          transform: scale(1.35);
          filter: url(#goldGlow);
        }
        3% {
          fill: #B7EACB;
          transform: scale(1);
          filter: none;
        }
      }
    </style>
  </defs>

  <g>
    <text class="letter" x="138" y="58" style="animation-delay:0s">F</text>
    <text class="letter" x="156" y="58" style="animation-delay:.045s">r</text>
