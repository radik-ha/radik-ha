
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100">

  <defs>
    <linearGradient id="softShine" gradientUnits="userSpaceOnUse" x1="-100" y1="0" x2="40" y2="0">

      <stop offset="0%" stop-color="#FFD966" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#FFE680" stop-opacity="0.6"></stop>
      <stop offset="50%" stop-color="#FFF4B8"></stop>
      <stop offset="60%" stop-color="#FFE680" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#FFD966" stop-opacity="0"></stop>

      <animate attributeName="x1" from="-100" to="1300" dur="3s" repeatCount="indefinite"></animate>

      <animate attributeName="x2" from="40" to="1440" dur="3s" repeatCount="indefinite"></animate>
    </linearGradient>
  </defs>

  <!-- Base text -->
  <text x="600" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="400" fill="#B7EACB">
    From the light of vision, reaching beyond all limits
  </text>

  <!-- Sharp moving shine, without glow -->
  <text x="600" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="400" fill="url(#softShine)">
    From the light of vision, reaching beyond all limits
  </text>

</svg>
