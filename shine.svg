
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70">

  <defs>
    <linearGradient id="greenGlow" gradientUnits="userSpaceOnUse" x1="-180" y1="0" x2="0" y2="0">

      <stop offset="0%" stop-color="#39FF88" stop-opacity="0"></stop>
      <stop offset="40%" stop-color="#B7FFCE" stop-opacity="0.85"></stop>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"></stop>
      <stop offset="60%" stop-color="#B7FFCE" stop-opacity="0.85"></stop>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0"></stop>

      <animate attributeName="x1" values="-180;1380" dur="2s" repeatCount="indefinite"></animate>

      <animate attributeName="x2" values="0;1560" dur="2s" repeatCount="indefinite"></animate>
    </linearGradient>
  </defs>

  <!-- Base green text -->
  <text x="12" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" font-weight="bold" fill="#00C875">From the light of vision, reaching beyond all limits 💫</text>

  <!-- Moving glow across the letters -->
  <text x="12" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-style="italic" font-weight="bold" fill="url(#greenGlow)">From the light of vision, reaching beyond all limits 💫</text>

</svg>
