
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">

  <defs>
    <linearGradient id="paleShine" gradientUnits="userSpaceOnUse" x1="-200" y1="0" x2="0" y2="0">

      <stop offset="0%" stop-color="#DDFBE8" stop-opacity="0"></stop>
      <stop offset="45%" stop-color="#F4FFF8" stop-opacity="0.9"></stop>
      <stop offset="50%" stop-color="#FFFFFF"></stop>
      <stop offset="55%" stop-color="#F4FFF8" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#DDFBE8" stop-opacity="0"></stop>

      <animate attributeName="x1" values="-200;1400" dur="2s" repeatCount="indefinite"></animate>

      <animate attributeName="x2" values="0;1600" dur="2s" repeatCount="indefinite"></animate>
    </linearGradient>
  </defs>

  <!-- Pale mint-green text -->
  <text x="600" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="500" fill="#B7EACB">
    From the light of vision, reaching beyond all limits
  </text>

  <!-- Moving shine effect -->
  <text x="600" y="45" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="500" fill="url(#paleShine)">
    From the light of vision, reaching beyond all limits
  </text>

</svg>
